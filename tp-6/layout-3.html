<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout 3</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .content {padding: 2em 0.5em; text-align: center;}
        .s1 {background-color: #ca9f77;}
        .s2 {background-color: #cbc168;}
        .s3 {background-color: #a3c55b;}
        .s4 {background-color: #78d179;}
        .s5 {background-color: #85e3c1;}
        .s6 {background-color: #79bfe5;}
    </style>
</head>
<body>
    <div class="container-fluid g-0">
        <div class="row g-0">

            <!-- sección 1: fila propia, centrada desde sm -->
            <div class="col-12 col-sm-4 col-lg-4 offset-sm-4 offset-lg-4 order-1">
                <div class="content s1">sección 1</div>
            </div>

            <!-- sección 2: mobile 4to, tablet 3er lugar (invertido), desktop 1er lugar de la fila -->
            <div class="col-12 col-sm-4 col-lg-4 order-4 order-sm-3 order-lg-2">
                <div class="content s2">sección 2</div>
            </div>

            <!-- sección 3: mismo lugar (centro) en mobile/tablet/desktop -->
            <div class="col-12 col-sm-4 col-lg-4 order-3 order-sm-2 order-lg-3">
                <div class="content s3">sección 3</div>
            </div>

            <!-- sección 4: mobile 2do, tablet 1er lugar (invertido), desktop 3er lugar de la fila -->
            <div class="col-12 col-sm-4 col-lg-4 order-2 order-sm-1 order-lg-4">
                <div class="content s4">sección 4</div>
            </div>

            <!-- sección 5: mitad, última en mobile, izquierda en tablet, derecha (con hueco) en desktop -->
            <div class="col-6 col-lg-4 offset-lg-4 order-6 order-sm-5 order-lg-6">
                <div class="content s5">sección 5</div>
            </div>

            <!-- sección 6: mitad, penúltima en mobile, derecha en tablet, izquierda en desktop -->
            <div class="col-6 col-lg-4 order-5 order-sm-6 order-lg-5">
                <div class="content s6">sección 6</div>
            </div>

        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
